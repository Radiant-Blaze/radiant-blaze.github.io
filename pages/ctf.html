    <main class="quest-screen">

        <a class="quest-brand" href="../index.html"

        <section class="quest-list" data-ctf-list aria-live="polite"></section>
        <aside class="sidebar" data-ctf-aside></aside>
      </div>

        <div class="quest-wrap">
