<!doctype html>
<html lang="en" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Search Database · Radiant Blaze</title>
    <meta name="description" content="Search the Radiant Blaze post database." />
    <link rel="canonical" href="https://radiant-blaze.github.io/pages/search.html" />
    <meta name="theme-color" content="#171329" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radiant Blaze" />
    <meta property="og:title" content="Search · Radiant Blaze" />
    <meta property="og:description" content="Search the Radiant Blaze post database." />
    <meta property="og:url" content="https://radiant-blaze.github.io/pages/search.html" />
    <meta property="og:image" content="https://radiant-blaze.github.io/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Search · Radiant Blaze" />
    <meta name="twitter:description" content="Search the Radiant Blaze post database." />
    <meta name="twitter:image" content="https://radiant-blaze.github.io/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/theme.js"></script>
  </head>
  <body>
    <main class="quest-screen">
      <header class="quest-top quest-wrap">
        <a class="quest-brand" href="../index.html"
          ><span class="pixel-logo">RB</span>RADIANT BLAZE</a
        >
        <nav class="quest-nav" aria-label="Blog navigation">
          <a href="blog.html">BLOG</a
          ><a aria-current="page" href="search.html">SEARCH</a
          ><a href="archive.html">ARCHIVE</a>
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-pressed="false"
            aria-label="Switch to light theme"
          >
            <span class="theme-icon" aria-hidden="true">☼</span>
          </button>
        </nav>
      </header>
      <section class="quest-hero quest-wrap">
        <p class="eyebrow">ARCHIVE TERMINAL · READY</p>
        <h1 class="quest-title">SEARCH DATABASE</h1>
        <form class="search-form" role="search">
          <label class="sr-only" for="search-database"
            >Search quest records</label
          ><input
            data-search
            id="search-database"
            type="search"
            placeholder="Search Database..."
          /><button class="pixel-button start-button" type="submit">
            SCAN →
          </button>
        </form>
        <p class="record-count" data-record-count>FOUND 3 RECORDS</p>
      </section>
      <div class="page-grid quest-wrap">
        <section
          class="quest-list"
          data-quest-list
          aria-live="polite"
        ></section>
      </div>
      <footer class="site-footer">
        <div class="quest-wrap">
          <p class="section-heading">CONNECT</p>
          <nav class="social-links" data-social aria-label="Social links"></nav>
        </div>
      </footer>
    </main>
    <script type="module" src="../assets/js/blog.js"></script>
  </body>
</html>
