<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Search · Radiant Blaze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../assets/css/blog.css" />
  </head>
  <body class="dark-theme">
    <main class="quest-screen">
      <header class="quest-top quest-wrap">
        <a class="quest-brand" href="../index.html"
          ><span class="pixel-logo">RB</span>RADIANT BLAZE</a
        >
        <nav class="quest-nav" aria-label="Blog navigation">
          <a href="blog.html">BLOG</a><a href="categories.html">CATEGORIES</a
          ><a aria-current="page" href="search.html">SEARCH</a
          ><a href="archive.html">ARCHIVE</a>
        </nav>
      </header>
      <section class="quest-hero quest-wrap">
        <p class="eyebrow">FIND A POST</p>
        <h1 class="quest-title">SEARCH</h1>
        <form class="search-form" role="search">
          <label class="sr-only" for="search-database"
            >Search blog posts</label
          ><input
            data-search
            id="search-database"
            type="search"
            placeholder="Search posts..."
          /><button class="pixel-button start-button" type="submit">
            SEARCH →
          </button>
        </form>
        <p class="record-count" data-record-count>FOUND 3 RECORDS</p>
      </section>
      <div class="page-grid quest-wrap">
        <section
          class="quest-list"
          data-quest-list
          aria-live="polite"
        ></section>
      </div>
    </main>
    <script src="../assets/js/blog.js"></script>
  </body>
</html>
